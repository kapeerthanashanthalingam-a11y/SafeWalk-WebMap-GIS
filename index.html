<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>SafeWalk - Western Province</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIINfQ3Qe5m7q2kP2Xg4Rk9g4s4Q4p5c5c="
        crossorigin="" />

    <!-- Your CSS -->
    <link rel="stylesheet"
        href="css/style.css">
</head>

<body>

    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="top-header">

        <div class="brand">

            <div class="brand-title">
                🚶 SafeWalk
            </div>

            <div class="brand-subtitle">
                Public Pedestrian Safety & Complaint Web Map
            </div>

        </div>

        <div class="header-buttons">

            <button id="locationBtn"
                class="location-btn">
                📍 My Location
            </button>

            <button id="reportBtn"
                class="report-btn">
                🚨 Report an Issue
            </button>

        </div>

    </header>


    <!-- =====================================================
         MAP
    ====================================================== -->

    <div id="map"></div>


    <!-- =====================================================
         CURRENT LOCATION DISPLAY
    ====================================================== -->

    <div id="locationInfo"
        class="location-info">

        📌 Your current location

    </div>


    <!-- =====================================================
         SAFEWALK REPORT SUMMARY
         MOVED TO BOTTOM-LEFT
    ====================================================== -->

    <div id="reportSummary"
        class="report-summary">

        <div class="summary-header">
            <span>🚨</span>
            <strong>SafeWalk Reports</strong>
        </div>

        <div class="summary-total">

            <div id="totalReports"
                class="total-number">
                0
            </div>

            <div class="total-label">
                Total Reports
            </div>

        </div>


        <!-- ISSUE TYPES -->

        <div class="summary-section">

            <h3>
                Issue Types
            </h3>

            <div id="issueCounts"
                class="issue-counts">

                <div class="loading">
                    Loading reports...
                </div>

            </div>

        </div>


        <!-- SEVERITY -->

        <div class="summary-section severity-section">

            <h3>
                Severity
            </h3>

            <div class="severity-row">

                <div class="severity-left">
                    <span class="severity-dot low"></span>
                    <span>Low</span>
                </div>

                <strong id="lowCount">
                    0
                </strong>

            </div>


            <div class="severity-row">

                <div class="severity-left">
                    <span class="severity-dot medium"></span>
                    <span>Medium</span>
                </div>

                <strong id="mediumCount">
                    0
                </strong>

            </div>


            <div class="severity-row">

                <div class="severity-left">
                    <span class="severity-dot severe"></span>
                    <span>Severe</span>
                </div>

                <strong id="severeCount">
                    0
                </strong>

            </div>

        </div>

    </div>


    <!-- =====================================================
         SEVERITY LEGEND
         ALIGNED WITH REPORT PANEL
    ====================================================== -->

    <div class="severity-legend">

        <div class="legend-title">
            Complaint Severity
        </div>

        <div class="legend-item">

            <span class="legend-symbol low-symbol"></span>

            <span>Low</span>

        </div>


        <div class="legend-item">

            <span class="legend-symbol medium-symbol"></span>

            <span>Medium</span>

        </div>


        <div class="legend-item">

            <span class="legend-symbol severe-symbol"></span>

            <span>Severe</span>

        </div>

    </div>


    <!-- =====================================================
         FORM MODAL
    ====================================================== -->

    <div id="formModal"
        class="form-modal">

        <div class="form-container">

            <button id="closeForm"
                class="close-form">
                ×
            </button>

            <iframe
                id="googleFormFrame"
                src=""
                title="SafeWalk Complaint Form">
            </iframe>

        </div>

    </div>


    <!-- =====================================================
         LEAFLET JS
    ====================================================== -->

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin="">
    </script>


    <!-- Your JavaScript -->

    <script src="js/script.js"></script>

</body>

</html>

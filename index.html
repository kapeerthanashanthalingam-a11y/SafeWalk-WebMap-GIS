<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SafeWalk | Western Province</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="brand-title">🚶 SafeWalk</div>
    <div class="brand-subtitle">Public Pedestrian Safety &amp; Complaint Web Map — Western Province</div>
  </div>
  <div class="header-actions">
    <button id="locateBtn" class="btn btn-light">📍 My Location</button>
    <button id="reportBtn" class="btn btn-danger">🚨 Report an Issue</button>
  </div>
</header>

<main>
  <div id="map"></div>
  <div class="status-panel" id="statusPanel">
    <b>Location:</b> <span id="locationStatus">Click “My Location” or click the map.</span>
  </div>
</main>

<div id="reportModal" class="modal hidden">
  <div class="modal-card">
    <div class="modal-header">
      <div>
        <h2>🚨 Report a Pedestrian Safety Issue</h2>
        <p>Your selected/current location is pre-filled in the form.</p>
      </div>
      <button id="closeModal" class="close-btn">×</button>
    </div>
    <div class="modal-actions">
      <button id="openFormBtn" class="btn btn-light">↗ Open Form in New Tab</button>
      <button id="refreshReportsBtn" class="btn btn-success">↻ Refresh Reports</button>
    </div>
    <iframe id="formFrame" title="SafeWalk Complaint Form" loading="lazy"></iframe>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="js/script.js"></script>
</body>
</html>
